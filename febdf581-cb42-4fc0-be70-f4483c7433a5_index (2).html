<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E7A5F">
<title>校园资产巡检</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F2F5F4; --card:#FFFFFF; --primary:#0E7A5F; --primary-2:#14A67E;
  --ink:#122520; --sub:#5F716B; --muted:#8C9B96; --line:#E7EDEB;
  --amber:#E39A32; --red:#DB5A48; --blue:#3A7AF0; --purple:#7A5AD8;
  --shadow:0 1px 2px rgba(14,45,35,.04), 0 6px 20px rgba(14,45,35,.06);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);
  padding-bottom:calc(78px + env(safe-area-inset-bottom));position:relative}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}

/* ===== 顶栏 ===== */
.hero{
  background:linear-gradient(150deg,#0B6A52 0%,#13996F 55%,#17A87C 100%);
  color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 54px;
  border-radius:0 0 26px 26px;position:relative;overflow:hidden;
}
.hero:after{content:"";position:absolute;right:-50px;top:-70px;width:190px;height:190px;
  border-radius:50%;background:rgba(255,255,255,.09)}
.hero:before{content:"";position:absolute;left:-40px;bottom:-80px;width:150px;height:150px;
  border-radius:50%;background:rgba(255,255,255,.07)}
.hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.16);
  display:grid;place-items:center;backdrop-filter:blur(4px)}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px}
.brand span{display:block;font-size:11px;opacity:.72;font-weight:400;letter-spacing:.8px;margin-top:-2px}
.role-chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.24);padding:7px 11px;border-radius:999px;font-size:12px}
.dot{width:6px;height:6px;border-radius:50%;background:#8BF3C4;box-shadow:0 0 0 3px rgba(139,243,196,.25)}
.hero-body{margin-top:18px;position:relative;z-index:1}
.hero-body h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.3px}
.hero-body p{margin:6px 0 0;font-size:12.5px;opacity:.82}

/* 统计浮层 */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin:-38px 14px 0;position:relative;z-index:2;background:var(--card);
  border-radius:18px;padding:14px 6px;box-shadow:var(--shadow)}
.kpi{text-align:center;position:relative}
.kpi+.kpi:before{content:"";position:absolute;left:0;top:14%;height:72%;width:1px;background:var(--line)}
.kpi b{display:block;font-size:19px;font-weight:700;letter-spacing:-.5px}
.kpi small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.c-teal{color:var(--primary)} .c-amber{color:var(--amber)} .c-red{color:var(--red)} .c-blue{color:var(--blue)}

/* ===== 通用区块 ===== */
.sec{margin:18px 14px 0}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 2px}
.sec-hd h3{margin:0;font-size:15px;font-weight:700;letter-spacing:.2px}
.sec-hd a{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:2px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.pad{padding:14px}
.hint{font-size:11.5px;color:var(--muted);line-height:1.7}

/* 快捷入口 */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:var(--card);
  border-radius:var(--r);padding:16px 8px;box-shadow:var(--shadow)}
.q{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:var(--sub)}
.q i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-style:normal}
.q svg{width:21px;height:21px;stroke-width:1.8}
.q1 i{background:#E7F5EF;color:var(--primary)} .q2 i{background:#FDF1E0;color:var(--amber)}
.q3 i{background:#E8F0FE;color:var(--blue)}  .q4 i{background:#F1EBFC;color:var(--purple)}

/* 待办 / 列表行 */
.row{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;position:relative}
.row+.row:before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;background:var(--line)}
.row .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:0 0 36px}
.row .ic svg{width:18px;height:18px;stroke-width:1.8}
.row .ic.teal{background:#E7F5EF;color:var(--primary)}
.row .ic.amber{background:#FDF1E0;color:var(--amber)}
.row .ic.red{background:#FCEBE8;color:var(--red)}
.row .ic.blue{background:#E8F0FE;color:var(--blue)}
.row .body{flex:1;min-width:0}
.row .t{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .d{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.chev{color:#C6D2CE;flex:0 0 auto;align-self:center}

/* 标签 */
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:6px;line-height:1.5;font-weight:500;white-space:nowrap}
.t-ok{background:#E7F5EF;color:#0E7A5F} .t-warn{background:#FDF1E0;color:#B4720F}
.t-red{background:#FCEBE8;color:#C0412F} .t-gray{background:#EFF2F1;color:#78867F}
.t-blue{background:#E8F0FE;color:#2A62C4} .t-purple{background:#F1EBFC;color:#6846C7}

/* ===== 底部导航 ===== */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;max-width:460px;margin:0 auto;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;
  color:#9AA6A2;padding:5px 0 3px;transition:color .15s}
.nav button svg{width:23px;height:23px;stroke-width:1.7}
.nav button.on{color:var(--primary);font-weight:500}
.nav button.on svg{stroke-width:2.1}

/* ===== 地图 ===== */
.mapwrap{position:relative;margin:0 14px;background:var(--card);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.mapsvg{display:block;width:100%;height:auto}
.maplegend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 14px;font-size:11px;color:var(--sub)}
.maplegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px;margin:12px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);
  font-size:12px;color:var(--sub);white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:500}

/* ===== 底部抽屉 ===== */
.mask{position:fixed;inset:0;background:rgba(10,26,22,.42);z-index:60;display:flex;
  align-items:flex-end;justify-content:center;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet{background:#fff;width:100%;max-width:460px;border-radius:22px 22px 0 0;
  max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:up .26s cubic-bezier(.2,.8,.3,1)}
.sheet-hd{position:sticky;top:0;background:#fff;z-index:2;padding:14px 18px 12px;
  border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.sheet-hd h4{margin:0;font-size:16px;font-weight:700;flex:1;line-height:1.45}
.sheet-bd{padding:16px 18px calc(20px + env(safe-area-inset-bottom))}
.close{width:30px;height:30px;border-radius:50%;background:#F1F4F3;display:grid;place-items:center;
  color:#7A8A84;flex:0 0 30px}
.grabber{width:38px;height:4px;border-radius:99px;background:#E2E8E6;margin:8px auto 0}

/* 详情字段 */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:0}
.f small{display:block;font-size:11px;color:var(--muted);margin-bottom:1px}
.f b{font-weight:500;font-size:13.5px}
.divider{height:1px;background:var(--line);margin:16px 0}
.lbl{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:500}

/* 时间轴 */
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:15px}
.tl-item:last-child{padding-bottom:0}
.tl-item:before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;
  background:#fff;border:2px solid var(--primary)}
.tl-item.gray:before{border-color:#C9D5D0}
.tl-item.amber:before{border-color:var(--amber)}
.tl-item.red:before{border-color:var(--red)}
.tl-item .tt{font-size:13px;font-weight:500}
.tl-item .tm{font-size:11px;color:var(--muted);margin-top:1px}
.tl-item .tn{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.6}

/* 按钮 */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border-radius:13px;
  background:var(--primary);color:#fff;font-size:15px;font-weight:500;width:100%;
  box-shadow:0 6px 16px rgba(14,122,95,.22)}
.btn.ghost{background:#fff;color:var(--primary);border:1px solid #CFE3DB;box-shadow:none}
.btn.soft{background:#EAF4F0;color:var(--primary);box-shadow:none}
.btn.danger{background:#FCEBE8;color:var(--red);box-shadow:none}
.btn:active{transform:scale(.985)}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

/* 表单 */
.formrow{margin-bottom:14px}
.formrow label{display:block;font-size:12.5px;color:var(--sub);font-weight:500;margin-bottom:7px}
.inp{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:#FAFCFB;
  padding:0 13px;font-size:14px;outline:none}
.inp:focus{border-color:#9AD3C2;background:#fff}
textarea.inp{height:88px;padding:11px 13px;resize:none;line-height:1.6}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23808F8A' stroke-width='1.6' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center}
.segs{display:flex;background:#EFF3F2;border-radius:12px;padding:3px;gap:3px}
.segs button{flex:1;height:38px;border-radius:10px;font-size:13px;color:var(--sub)}
.segs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.07)}

/* 巡检项 */
.checkitem{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.checkitem:last-child{border-bottom:0}
.checkitem .nm{flex:1;font-size:13.5px}
.yn{display:flex;gap:6px}
.yn button{width:50px;height:31px;border-radius:9px;font-size:12px;background:#F1F4F3;color:var(--sub);font-weight:500}
.yn button.ok{background:#E7F5EF;color:#0E7A5F}
.yn button.bad{background:#FCEBE8;color:#C0412F}

/* 照片 */
.photo-add{position:relative;width:80px;height:80px;border-radius:12px;border:1px dashed #C9D8D2;
  background:#FAFCFB;display:grid;place-items:center;color:var(--muted);font-size:11px;gap:3px;overflow:hidden}
.photo-add input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.photo-add img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:9px;flex-wrap:wrap}

/* 工单状态条 */
.steps{display:flex;margin:4px 0 2px}
.step{flex:1;text-align:center;position:relative;font-size:10.5px;color:var(--muted)}
.step:before{content:"";display:block;height:3px;background:#E6EDEA;margin:0 2px 7px;border-radius:3px}
.step.on{color:var(--primary);font-weight:500}
.step.on:before{background:var(--primary)}
.progress{height:8px;border-radius:9px;background:#EAF0EE;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#14A67E,#0E7A5F);border-radius:9px}
.pct{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin:7px 0 6px}

/* 空态 */
.empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:12.5px}
.empty svg{width:40px;height:40px;stroke:#CBD8D3;margin:0 auto 10px;display:block;stroke-width:1.4}

/* Toast */
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);z-index:99;
  background:rgba(16,38,32,.92);color:#fff;font-size:13px;padding:11px 18px;border-radius:12px;
  opacity:0;transition:.22s;pointer-events:none;max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 我的 */
.profile{display:flex;align-items:center;gap:13px;padding:18px 16px}
.avatar{width:52px;height:52px;border-radius:18px;background:linear-gradient(140deg,#13996F,#0B6A52);
  color:#fff;display:grid;place-items:center;font-size:19px;font-weight:700;box-shadow:0 6px 14px rgba(14,122,95,.22)}
.profile .nm{font-size:16.5px;font-weight:700}
.profile .rl{font-size:11.5px;color:var(--muted);margin-top:2px}
.menulist .row{padding:14px 16px}

@media (min-width:520px){
  body{background:#E8EDEB}
  .app{box-shadow:0 0 40px rgba(0,0,0,.08);min-height:100vh}
}

/* ===== 登录 / 注册 ===== */
.auth{background:#F1F5F3}
.auth-hero{background:linear-gradient(150deg,#0B6A52 0%,#13996F 55%,#17A87C 100%);color:#fff;
  padding:calc(30px + env(safe-area-inset-top)) 22px 66px;border-radius:0 0 26px 26px;
  position:relative;overflow:hidden}
.auth-hero:after{content:"";position:absolute;right:-46px;top:-64px;width:180px;height:180px;
  border-radius:50%;background:rgba(255,255,255,.09)}
.auth-hero:before{content:"";position:absolute;left:-50px;bottom:-90px;width:160px;height:160px;
  border-radius:50%;background:rgba(255,255,255,.07)}
.auth-mark{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.18);
  display:grid;place-items:center;margin-bottom:16px;position:relative;z-index:1}
.auth-hero h1{font-size:23px;margin:0 0 6px;position:relative;z-index:1}
.auth-hero p{font-size:11px;letter-spacing:1.5px;opacity:.82;margin:0;position:relative;z-index:1}
.auth-card{background:#fff;margin:-44px 14px 0;border-radius:18px;padding:18px 16px 16px;
  box-shadow:var(--shadow);position:relative;z-index:2}
.seg{display:flex;background:#F1F4F3;border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;height:40px;border-radius:9px;font-size:13.5px;color:var(--sub);
  display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 3px rgba(14,45,35,.08)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;padding-left:2px}
.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 13px;
  font-size:14px;background:#FBFDFC;outline:none}
.field input:focus{border-color:var(--primary);background:#fff}
.auth-msg{font-size:12.5px;color:var(--red);min-height:18px;margin:0 0 8px;padding-left:2px}
.auth-btn{width:100%;height:48px;border-radius:13px;background:var(--primary);color:#fff;
  font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.demo-fill{display:flex;gap:8px;margin-top:10px}
.demo-fill button{flex:1;height:34px;border-radius:9px;background:#F1F4F3;font-size:11.5px;color:var(--sub)}
.auth-link{text-align:center;font-size:13px;color:var(--sub);margin-top:16px}
.auth-link b{color:var(--primary);font-weight:600}
.auth-note{margin:14px 16px 30px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.9}
</style>
</head>

/* ---------- 工具 ---------- */
function asset(id){ return db.assets.find(a=>a.id===id) || {name:'未知资产',code:'-',bld:'-',room:'-'}; }
function assetByCode(c){ return db.assets.find(a=>a.code===c); }
function statusTag(s){
  const m = {'正常':'t-ok','待维修':'t-warn','维修中':'t-blue','停用':'t-gray'};
  return `<span class="tag ${m[s]||'t-gray'}">${s}</span>`;
}
function orderTag(s){
  const m = {'待派单':'t-red','维修中':'t-blue','待验收':'t-purple','已归档':'t-gray'};
  return `<span class="tag ${m[s]||'t-gray'}">${s}</span>`;
}
function levelTag(l){ return l==='紧急' ? '<span class="tag t-red">紧急</span>' : '<span class="tag t-gray">一般</span>'; }
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 2000);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- 统计 ---------- */
function stats(){
  const today = fmt(NOW());
  const todayTasks = db.tasks.filter(t=>t.due===today);
  const done = todayTasks.filter(t=>t.status==='已完成').length;
  const openOrders = db.orders.filter(o=>o.status!=='已归档').length;
  const urgent = db.orders.filter(o=>o.status!=='已归档' && o.level==='紧急').length;
  const rate = todayTasks.length ? Math.round(done/todayTasks.length*100) : 0;
  const riskAssets = db.assets.filter(a=>a.risk==='高').length;
  return {total:db.assets.length, todayTotal:todayTasks.length, todayDone:done, openOrders, urgent, rate, riskAssets};
}

function greet(){
  const h = NOW().getHours();
  if(h<6) return '夜深了';
  if(h<9) return '早上好';
  if(h<12) return '上午好';
  if(h<14) return '中午好';
  if(h<18) return '下午好';
  return '晚上好';
}

function taskRow(t){
  const a = asset(t.asset);
  const overdue = t.status==='待巡检' && t.due < fmt(NOW());
  return `
  <div class="row" data-act="task" data-id="${t.id}">
    <div class="ic ${t.status==='已完成'?'teal':(overdue?'red':'amber')}">${ic(t.status==='已完成'?'check':'task')}</div>
    <div class="body">
      <div class="t">${esc(t.title)} ${t.status==='已完成'?'<span class="tag t-ok">已完成</span>':(overdue?'<span class="tag t-red">逾期</span>':'<span class="tag t-warn">待巡检</span>')}</div>
      <div class="d"><span>${a.bld} ${a.room}</span><span>${t.due==fmt(NOW())?'今日截止':t.due+' 截止'}</span></div>
    </div>
    <span class="chev">›</span>
  </div>`;
}

function orderRow(o){
  const a = asset(o.asset);
  return `
  <div class="row" data-act="order" data-id="${o.id}">
    <div class="ic ${o.level==='紧急'?'red':'blue'}">${ic('order')}</div>
    <div class="body">
      <div class="t">${esc(o.title)}</div>
      <div class="d"><span>${a.bld} ${a.room}</span><span>${levelTag(o.level)}</span>${orderTag(o.status)}</div>
    </div>
    <span class="chev">›</span>
  </div>`;
}

/* ============================================================
   抽屉：资产档案 / 工单详情 / 任务详情 / 资产列表 / 报表
   ============================================================ */
function sheetWrap(inner){
  return `<div class="mask" data-act="mask"><div class="sheet">
    <div class="grabber"></div>${inner}</div></div>`;
}

function assetSheet(id){
  const a = asset(id);
  const ords = db.orders.filter(o=>o.asset===id).sort((x,y)=>y.createdAt-x.createdAt);
  const ownLogs = db.logs.filter(l=>l.asset===id);
  const orderLogs = ords.flatMap(o=>o.logs.map(l=>({kind:'工单', t:l.t, by:l.by, txt:'【'+o.id+'】'+l.txt})));
  const logs = [...ownLogs, ...orderLogs].sort((x,y)=>y.t-x.t);
  const days = a.last? daysBetween(a.last, fmt(NOW())) : 0;
  return sheetWrap(`
    <div class="sheet-hd">
      <div style="flex:1">
        <h4>${esc(a.name)}</h4>
        <div style="font-size:11.5px;color:var(--muted);margin-top:3px">${a.code} · ${a.bld} ${a.room}</div>
      </div>
      <button class="close" data-act="close">✕</button>
    </div>
    <div class="sheet-bd">
      <div style="display:flex;gap:8px;margin-bottom:14px">${statusTag(a.status)}
        <span class="tag ${a.risk==='高'?'t-red':(a.risk==='中'?'t-warn':'t-gray')}">风险 ${a.risk}</span>
        <span class="tag t-blue">${a.type}</span></div>
      <div class="fields">
        <div class="f"><small>资产编号</small><b>${a.code}</b></div>
        <div class="f"><small>责任人 / 部门</small><b>${esc(a.owner)}</b></div>
        <div class="f"><small>采购时间</small><b>${a.buy}</b></div>
        <div class="f"><small>巡检周期</small><b>每 ${a.cycle} 天</b></div>
        <div class="f"><small>上次巡检</small><b>${a.last}（${days} 天前）</b></div>
        <div class="f"><small>下次应检</small><b style="color:${days>=a.cycle?'var(--red)':'var(--primary)'}">${addDays(a.last, a.cycle)}</b></div>
      </div>
      <div class="divider"></div>
      <p class="lbl">关联工单（${ords.length}）</p>
      ${ords.length? ords.map(o=>`
        <div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)">
          <div style="flex:1;font-size:13px">${esc(o.title)}</div>${orderTag(o.status)}
        </div>`).join('') : '<p class="hint">暂无工单记录</p>'}
      <div class="divider"></div>
      <p class="lbl">全生命周期履历</p>
      <div class="tl">
        ${logs.length? logs.map(l=>`
          <div class="tl-item ${l.kind==='报修'?'red':(l.kind==='工单'?'amber':(l.kind==='维修'?'green':''))}">
            <div class="tt">${l.kind}</div>
            <div class="tm">${fmtT(l.t)} · ${esc(l.by)}</div>
            <div class="tn">${esc(l.txt)}</div>
          </div>`).join('') : `<div class="tl-item gray"><div class="tt">暂无履历</div><div class="tn">该资产尚无可查的巡检、报修或维修记录。</div></div>`}
      </div>
      <div style="height:16px"></div>
      <div class="btn-row">
        <button class="btn ghost" data-act="close">关闭</button>
        <button class="btn" data-act="report" data-asset="${a.id}">上报问题</button>
      </div>
    </div>`);
}
function addDays(d, n){
  const t = new Date(d); t.setDate(t.getDate()+Number(n)); return fmt(t);
}

function orderSheet(id){
  const o = db.orders.find(x=>x.id===id);
  if(!o) return sheetWrap('<div class="sheet-bd">工单不存在</div>');
  const a = asset(o.asset);
  const st = ['待派单','维修中','待验收','已归档'];
  const idx = st.indexOf(o.status);
  const isAdmin = state.role==='admin';
  let actions = '';
  if(isAdmin){
    if(o.status==='待派单') actions = `<button class="btn" data-act="adv" data-id="${o.id}">派单给维保单位</button>`;
    else if(o.status==='维修中') actions = `<button class="btn" data-act="adv" data-id="${o.id}">提交验收</button>`;
    else if(o.status==='待验收') actions = `<div class="btn-row">
        <button class="btn ghost" data-act="reject" data-id="${o.id}">退回返修</button>
        <button class="btn" data-act="adv" data-id="${o.id}">验收通过并归档</button></div>`;
    else actions = `<button class="btn soft" data-act="close">已归档，仅可查看</button>`;
  } else {
    actions = o.status==='已归档'
      ? `<button class="btn soft" data-act="close">已归档，等待管理员处理</button>`
      : `<button class="btn soft" data-act="close">已提交，等待管理员处理</button>`;
  }
  return sheetWrap(`
    <div class="sheet-hd">
      <div style="flex:1"><h4>${esc(o.title)}</h4>
        <div style="font-size:11.5px;color:var(--muted);margin-top:3px">${o.id} · ${a.bld} ${a.room} · ${esc(a.name)}</div></div>
      <button class="close" data-act="close">✕</button>
    </div>
    <div class="sheet-bd">
      <div style="display:flex;gap:8px;margin-bottom:14px">${levelTag(o.level)}${orderTag(o.status)}
        <span class="tag t-gray">上报：${esc(o.reporter)}</span></div>
      <div class="steps">
        ${st.map((s,i)=>`<div class="step ${i<=idx?'on':''}">${s}</div>`).join('')}
      </div>
      <div class="divider"></div>
      <div class="pct"><span>维修进度</span><b>${o.progress}%</b></div>
      <div class="progress"><i style="width:${o.progress}%"></i></div>
      <div class="divider"></div>
      <p class="lbl">处理过程留痕</p>
      <div class="tl">
        ${o.logs.slice().sort((x,y)=>y.t-x.t).map((l,i)=>`
          <div class="tl-item ${i===0?'':'gray'}">
            <div class="tt">${esc(l.by)}</div>
            <div class="tm">${fmtT(l.t)}</div>
            <div class="tn">${esc(l.txt)}</div>
          </div>`).join('')}
      </div>
      ${o.photos && o.photos.length?`
      <div class="divider"></div>
      <p class="lbl">现场照片（${o.photos.length}）</p>
      <div class="thumbs">${o.photos.map(p=>`<div class="photo-add"><img src="${p}" alt="现场照片"></div>`).join('')}</div>`:''}
      <div style="height:16px"></div>
      ${actions}
    </div>`);
}

function taskSheet(id){
  const t = db.tasks.find(x=>x.id===id);
  if(!t) return sheetWrap('<div class="sheet-bd">任务不存在</div>');
  const a = asset(t.asset);
  const done = t.status==='已完成';
  const bad = t.items.filter(i=>i.v===0).length;
  return sheetWrap(`
    <div class="sheet-hd">
      <div style="flex:1"><h4>${esc(t.title)}</h4>
        <div style="font-size:11.5px;color:var(--muted);margin-top:3px">${a.bld} ${a.room} · ${esc(a.name)} · ${t.due} 截止</div></div>
      <button class="close" data-act="close">✕</button>
    </div>
    <div class="sheet-bd">
      <div style="display:flex;gap:8px;margin-bottom:12px">
        ${done?'<span class="tag t-ok">已完成</span>':(t.due<fmt(NOW())?'<span class="tag t-red">已逾期</span>':'<span class="tag t-warn">待巡检</span>')}
        ${a.risk==='高'?'<span class="tag t-red">高风险点位</span>':''}
        <span class="tag t-gray">周期 ${a.cycle} 天</span>
      </div>
      <div class="divider" style="margin-top:0"></div>
      <p class="lbl">巡检项（正常 / 异常）</p>
      ${t.items.map((it,i)=>`
        <div class="checkitem">
          <div class="nm">${esc(it.n)}</div>
          <div class="yn">
            <button class="${it.v===1?'ok':''}" data-act="yn" data-id="${t.id}" data-i="${i}" data-v="1" ${done?'disabled':''}>正常</button>
            <button class="${it.v===0?'bad':''}" data-act="yn" data-id="${t.id}" data-i="${i}" data-v="0" ${done?'disabled':''}>异常</button>
          </div>
        </div>`).join('')}
      <div class="divider"></div>
      <div class="formrow">
        <label>现场照片（可调起手机相机）</label>
        <div class="thumbs" id="thumbs">
          <label class="photo-add">
            ${ic('camera',20)}<span>拍照</span>
            <input type="file" accept="image/*" capture="environment" onchange="onPickPhoto(this,'task')">
          </label>
        </div>
      </div>
      <div class="formrow">
        <label>巡检备注</label>
        <textarea class="inp" id="taskNote" placeholder="记录现场情况，异常项请说明具体现象…" ${done?'disabled':''}>${done?esc(t.note||''):''}</textarea>
      </div>

/* ---------- 渲染主框架 ---------- */
const TABS = [
  {k:'home', n:'工作台', i:'home'},
  {k:'map', n:'地图', i:'map'},
  {k:'task', n:'巡检', i:'task'},
  {k:'order', n:'工单', i:'order'},
  {k:'me', n:'我的', i:'me'}
];
function render(){
  if(!session){
    document.getElementById('app').innerHTML = viewAuth();
    return;
  }
  let body = '';
  if(state.tab==='home') body = viewHome();
  else if(state.tab==='map') body = viewMap();
  else if(state.tab==='task') body = viewTask();
  else if(state.tab==='order') body = viewOrder();
  else body = viewMe();

  let sheet = '';
  if(state.sheet){
    const {type, id} = state.sheet;
    if(type==='asset') sheet = assetSheet(id);
    else if(type==='order') sheet = orderSheet(id);
    else if(type==='task') sheet = taskSheet(id);
    else if(type==='assets') sheet = assetListSheet();
    else if(type==='stats') sheet = statsSheet();
    else if(type==='newTask') sheet = taskCreateSheet();
    else if(type==='report') sheet = reportSheet(id);
  }

  const nav = `<div class="nav">
    ${TABS.map(t=>`<button class="${state.tab===t.k?'on':''}" data-act="tab" data-tab="${t.k}">
      ${ic(t.i,23)}<span>${t.n}</span></button>`).join('')}
  </div>`;

  document.getElementById('app').innerHTML = body + nav + sheet;
}

/* ---------- 照片处理（压缩后存内存 draft） ---------- */
let draftPhotos = [];
function onPickPhoto(input, scope){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const MAX = 720;
      let w = img.width, h = img.height;
      if(w>h && w>MAX){ h = h*MAX/w; w = MAX; }
      else if(h>=w && h>MAX){ w = w*MAX/h; h = MAX; }
      const cv = document.createElement('canvas');
      cv.width = Math.round(w); cv.height = Math.round(h);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const data = cv.toDataURL('image/jpeg', 0.62);
      draftPhotos.push(data);
      const box = document.getElementById('thumbs');
      if(box){
        const wrap = box.querySelector('.photo-add');
        const thumb = document.createElement('div');
        thumb.className='photo-add';
        thumb.innerHTML = `<img src="${data}" alt="现场照片">`;
        box.insertBefore(thumb, wrap);
      }
      toast('照片已添加（自动压缩）');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- 交互 ---------- */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  if(act==='mask'){
    if(e.target.closest('.sheet')) return;   // 点抽屉内部空白不关闭
    state.sheet=null; draftPhotos=[]; render(); return;
  }
  if(act==='close'){ state.sheet=null; draftPhotos=[]; render(); return; }

  if(act==='tab'){ state.tab = el.dataset.tab; state.sheet=null; window.scrollTo({top:0,behavior:'instant'}); render(); return; }
  if(act==='authRole'){ state.authRole = el.dataset.v; state.authMsg=''; render(); return; }
  if(act==='authMode'){ state.authMode = el.dataset.v; state.authMsg=''; state.draftAuth={}; render(); return; }
  if(act==='fillDemo'){
    const acc = el.dataset.v;
    state.authRole = acc;
    state.draftAuth = {acc:acc, pwd:'123456'};
    state.authMsg='';
    state.authMode='login';
    render(); return;
  }
  if(act==='doLogin'){
    const acc = (document.getElementById('a-acc').value||'').trim();
    const pwd = (document.getElementById('a-pwd').value||'').trim();
    state.draftAuth = {acc:acc, pwd:pwd};
    if(!acc || !pwd){ state.authMsg='请填写账号与密码'; render(); return; }
    const u = users.find(x=>x.acc.toLowerCase()===acc.toLowerCase());
    if(!u){ state.authMsg='账号不存在，可先注册新账号'; render(); return; }
    if(u.pwd!==pwd){ state.authMsg='密码不正确'; render(); return; }
    if(u.role!==state.authRole){
      state.authMsg='该账号角色为'+(u.role==='admin'?'管理员':'巡检员')+'，请切换身份后登录';
      render(); return;
    }
    setSession(u); state.role=u.role; state.tab='home'; state.authMsg=''; state.draftAuth={};
    render(); toast('欢迎回来，'+u.name);
    return;
  }
  if(act==='doRegister'){
    const name=(document.getElementById('r-name').value||'').trim();
    const dept=(document.getElementById('r-dept').value||'').trim();
    const acc=(document.getElementById('r-acc').value||'').trim();
    const pwd=(document.getElementById('r-pwd').value||'').trim();
    state.draftAuth={name:name, dept:dept, rAcc:acc, rPwd:pwd};
    if(name.length<2){ state.authMsg='请填写真实姓名（至少 2 个字）'; render(); return; }
    if(!dept){ state.authMsg='请填写部门或岗位'; render(); return; }
    if(acc.length<3){ state.authMsg='账号至少 3 位，建议用拼音或工号'; render(); return; }
    if(pwd.length<4){ state.authMsg='密码至少 4 位'; render(); return; }
    if(users.some(x=>x.acc.toLowerCase()===acc.toLowerCase())){ state.authMsg='该账号已存在，换一个或直接登录'; render(); return; }
    const u={acc:acc, name:name, dept:dept, role:state.authRole, pwd:pwd};
    users.push(u); saveUsers();
    setSession(u); state.role=u.role; state.tab='home'; state.authMsg=''; state.draftAuth={};
    render(); toast('注册成功，已登录');
    return;
  }
  if(act==='logout'){
    if(!confirm('确定退出当前账号？')) return;
    clearSession(); state.sheet=null; state.draftAuth={}; state.authMsg=''; state.tab='home'; render();
    toast('已退出登录');
    return;
  }
  if(act==='ftype'){ state.filterType = el.dataset.v; render(); return; }
  if(act==='forder'){ state.filterOrder = el.dataset.v; render(); return; }

  if(act==='asset'){ state.sheet={type:'asset', id:el.dataset.id}; render(); return; }
  if(act==='order'){ state.sheet={type:'order', id:el.dataset.id}; render(); return; }
  if(act==='task'){ draftPhotos=[]; state.sheet={type:'task', id:el.dataset.id}; render(); return; }
  if(act==='assets'){ state.sheet={type:'assets'}; render(); return; }
  if(act==='stats'){ state.sheet={type:'stats'}; render(); return; }
  if(act==='newTask'){ state.sheet={type:'newTask'}; render(); return; }
  if(act==='report'){ draftPhotos=[]; state.sheet={type:'report', id:el.dataset.asset}; render(); return; }

  if(act==='level'){
    document.querySelectorAll('#rpLevel button').forEach(b=>b.classList.remove('on'));
    el.classList.add('on');
    return;
  }

  if(act==='yn'){
    const t = db.tasks.find(x=>x.id===el.dataset.id);
    const i = +el.dataset.i, v = +el.dataset.v;
    t.items[i].v = v; save();
    const item = el.closest('.checkitem');
    if(item) item.querySelectorAll('.yn button').forEach(b=>b.classList.remove('ok','bad'));
    el.classList.add(v===1?'ok':'bad');
    const bad = t.items.filter(x=>x.v===0).length;
    const hint = document.getElementById('taskHint');
    if(hint){ hint.style.display = bad? 'block':'none'; const n=document.getElementById('badCount'); if(n) n.textContent=bad; }
    return;
  }

  if(act==='submitTask'){
    const t = db.tasks.find(x=>x.id===el.dataset.id);
    const a = asset(t.asset);
    const note = (document.getElementById('taskNote')||{}).value || '';
    const bad = t.items.filter(i=>i.v===0);
    const unfilled = t.items.filter(i=>i.v===null).length;
    if(unfilled){ toast(`还有 ${unfilled} 项未勾选，请完成后再提交`); return; }
    t.status='已完成'; t.doneAt=Date.now(); t.by=db.profile.staffName; t.note=note||'各项检查完成。';
    a.last = fmt(NOW());
    db.logs.push({id:uid('L'), asset:a.id, kind:'巡检', t:Date.now(), by:db.profile.staffName,
      txt:`${t.title}：${t.items.map(i=>i.n+'·'+(i.v?'正常':'异常')).join('；')}${note?'。'+note:''}`});
    if(bad.length){
      a.status='待维修';
      const o = {
        id:'W'+(db.orders.length+1).toString().padStart(2,'0'), asset:a.id,
        title:`${a.name} 巡检异常（${bad.length}项）`,
        level: a.risk==='高'?'紧急':'一般', reporter:db.profile.staffName,
        createdAt:Date.now(), status:'待派单', progress:0, photos:draftPhotos.slice(),
        logs:[{t:Date.now(), by:db.profile.staffName, txt:`巡检发现 ${bad.length} 项异常：${bad.map(i=>i.n).join('、')}。${note}`}]
      };
      db.orders.unshift(o);
      db.logs.push({id:uid('L'), asset:a.id, kind:'报修', t:Date.now(), by:db.profile.staffName,
        txt:`自动生成工单 ${o.id}，已推送管理员。`});
      save(); draftPhotos=[]; state.sheet=null; render();
      toast(`巡检已提交，发现 ${bad.length} 项异常，工单已自动生成`);
      return;
    }
    save(); draftPhotos=[]; state.sheet=null; render();
    toast('巡检完成，全部正常，已写入履历');
    return;
  }

  if(act==='submitReport'){
    const assetId = (document.getElementById('rpAsset')||{}).value;
    const title = ((document.getElementById('rpTitle')||{}).value||'').trim();
    const desc = ((document.getElementById('rpDesc')||{}).value||'').trim();
    if(!title){ toast('请填写问题标题'); return; }
    const lvBtn = document.querySelector('#rpLevel button.on');
    const level = lvBtn? lvBtn.dataset.v : '一般';
    const a = asset(assetId);
    const o = {
      id:'W'+(db.orders.length+1).toString().padStart(2,'0'), asset:assetId, title,
      level, reporter:db.profile.staffName, createdAt:Date.now(), status:'待派单',
      progress:0, logs:[{t:Date.now(), by:db.profile.staffName, txt:(desc||title)+'（现场拍照上报）'}],
      photos:draftPhotos.slice()
    };
    db.orders.unshift(o);
    if(a.status==='正常') a.status='待维修';
    db.logs.push({id:uid('L'), asset:assetId, kind:'报修', t:Date.now(), by:db.profile.staffName, txt:title+'。'+(desc||'')});
    save(); draftPhotos=[]; state.sheet=null; render();
    toast(`上报成功，工单 ${o.id} 已推送给管理员`);
    return;
  }

  if(act==='adv'){
    const o = db.orders.find(x=>x.id===el.dataset.id);
    const next = {'待派单':'维修中','维修中':'待验收','待验收':'已归档'}[o.status];
    if(!next) return;
    const a = asset(o.asset);
    o.status = next;
    if(next==='维修中'){ o.progress = Math.max(o.progress, 20); o.logs.push({t:Date.now(), by:db.profile.adminName, txt:'已派单至维保单位，要求 24 小时内到场处理。'}); }
    if(next==='待验收'){ o.progress = 90; o.logs.push({t:Date.now(), by:'维修师傅', txt:'维修完成，现场测试正常，提交验收。'}); }
    if(next==='已归档'){
      o.progress = 100; a.status='正常';
      o.logs.push({t:Date.now(), by:db.profile.adminName, txt:'验收通过，工单归档，结果写入设备履历。'});
      db.logs.push({id:uid('L'), asset:a.id, kind:'维修', t:Date.now(), by:db.profile.adminName, txt:`${o.title} 已完成维修并验收归档。`});
    }
    save();
    state.sheet = next==='已归档' ? null : {type:'order', id:o.id};
    render();
    toast(next==='已归档' ? '验收通过，工单已归档并写入资产履历' : '状态已更新：'+next);
    return;
  }

  if(act==='reject'){
    const o = db.orders.find(x=>x.id===el.dataset.id);
    o.status='维修中'; o.progress=60;
    o.logs.push({t:Date.now(), by:db.profile.adminName, txt:'验收未通过：现场仍有异常，退回返修。'});
    save(); state.sheet={type:'order', id:o.id}; render();
    toast('已退回返修');
    return;
  }

  if(act==='createTask'){
    const assetId = document.getElementById('ntAsset').value;
    const title = (document.getElementById('ntTitle').value||'').trim();
    const due = document.getElementById('ntDue').value || fmt(NOW());
    const a = asset(assetId);
    db.tasks.push({
      id:'T'+(db.tasks.length+1).toString().padStart(2,'0'),
      title: title || `${a.bld}${a.room} 例行巡检`,
      asset: assetId, assignee:'staff', due, status:'待巡检',
      items:[{n:'设备外观完好',v:null},{n:'运行状态正常',v:null},{n:'安全防护有效',v:null},{n:'周边环境整洁',v:null}]
    });
    save(); state.sheet=null; state.tab='task'; render();
    toast('任务已下发，巡检员将收到提醒');
    return;
  }

  if(act==='export'){ exportCSV(); return; }

  if(act==='reset'){
    if(confirm('确定重置演示数据？当前改动将全部丢失。')){
      localStorage.removeItem(KEY); db = seed(); save(); state.sheet=null; render(); toast('已恢复初始演示数据');
    }
    return;
  }
});

/* ---------- 导出 ---------- */
function exportCSV(){
  const rows = [['工单编号','资产编号','资产名称','位置','问题描述','紧急程度','状态','进度','上报人','上报时间','处理节点']];
  db.orders.forEach(o=>{
    const a = asset(o.asset);
    rows.push([o.id, a.code, a.name, a.bld+a.room, o.title, o.level, o.status, o.progress+'%',
      o.reporter, new Date(o.createdAt).toLocaleString('zh-CN'), o.logs.map(l=>l.by+':'+l.txt).join(' / ')]);
  });
  rows.push([]);
  rows.push(['资产编号','资产名称','类别','位置','责任人','采购','巡检周期','风险','状态','上次巡检']);
  db.assets.forEach(a=>rows.push([a.code,a.name,a.type,a.bld+a.room,a.owner,a.buy,a.cycle+'天',a.risk,a.status,a.last]));
  const csv = '\uFEFF' + rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = `校园资产巡检台账_${fmt(NOW())}.csv`;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  state.sheet=null; render();
  toast('台账已导出，可用 Excel 打开');
}

/* ---------- 启动 ---------- */
render();
</script>
</body>
</html>
